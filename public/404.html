<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Abdelrahman Samara</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Vercel shows this page for any address that doesn't exist. It is plain HTML,
         so it works even when the site's scripts and fonts don't load. -->
    <script>
      // Uses the theme the visitor picked on the portfolio, if any. Without one,
      // the colours below follow the device's light or dark setting.
      try {
        var theme = localStorage.getItem('theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (error) {}
    </script>
    <style>
      /* The same colours as the portfolio's light and dark themes (src/index.css). */
      :root {
        color-scheme: light;
        --page: #e5ece4;
        --ink: #1e3a2f;
        --accent-ink: #b0234f;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --page: #0a130f;
          --ink: #e5ece4;
          --accent-ink: #ef7d9c;
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --page: #0a130f;
        --ink: #e5ece4;
        --accent-ink: #ef7d9c;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 1rem;
        background: var(--page);
        color: var(--ink);
        font: 1.125rem/1.6 ui-sans-serif, system-ui, sans-serif;
      }
      main {
        max-width: 33rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 2.25rem;
        line-height: 1.1;
      }
      p {
        margin: 0 0 1.5rem;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        padding: 0 1rem;
        border: 2px solid var(--ink);
        border-radius: 0.375rem;
        color: inherit;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        background: var(--ink);
        color: var(--page);
      }
      a:focus-visible {
        outline: 3px solid var(--accent-ink);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>This address doesn’t match any page on the site. The portfolio is all on one page.</p>
      <a href="/">Go to the portfolio</a>
    </main>
  </body>
</html>
